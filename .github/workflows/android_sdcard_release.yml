name: Android Release Build (SD Card Fix)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.worktrees/**'
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/android_sdcard_debug.yml'
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Release tag suffix (e.g. v2.1.9+7). Leave empty to auto-generate.'
        required: false
        default: ''
        type: string

jobs:
  android-release:
    name: Build Android Release APK (arm64 + arm32 + x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # 本仓库依赖 Flutter SDK 补丁才能编译
      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      # Build release APKs split by ABI — signed with default debug keystore
      - name: Build Release APKs (split per ABI)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --no-pub

      # Generate a timestamp-based tag or use user-supplied suffix
      - name: Generate release tag
        id: tag
        run: |
          SUFFIX="${{ github.event.inputs.tag_suffix }}"
          if [ -z "$SUFFIX" ]; then
            VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
            SUFFIX="v${VERSION}-sd-$(date +'%Y%m%d-%H%M')"
          fi
          TAG="${SUFFIX}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      # Rename APKs to meaningful names
      - name: Rename APKs
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
            dest="piliplus_${TAG}_${abi}.apk"
            mv "$file" "$dest"
            echo "Renamed: $file -> $dest"
          done

      # Upload each ABI as a separate artifact (available 90 days)
      - name: Upload arm64-v8a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-sdcard-arm64-v8a
          path: piliplus_*_arm64-v8a.apk
          retention-days: 90

      - name: Upload armeabi-v7a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-sdcard-armeabi-v7a
          path: piliplus_*_armeabi-v7a.apk
          retention-days: 90

      - name: Upload x86_64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-sdcard-x86_64
          path: piliplus_*_x86_64.apk
          retention-days: 90

      # Create a formal release on GitHub Releases with all three APKs
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: false
          name: "PiliPlus SD – ${{ steps.tag.outputs.tag }}"
          body: |
            ## PiliPlus SD 正式发布版 (${{ steps.tag.outputs.tag }})

            ### 🚀 核心更新与技术重构
            1. **离线缓存独立「正在缓存」子界面**：
               - 离线缓存界面右上角新增独立入口按钮（附带当前未完成任务数量角标 Badge），支持直达；
               - 列表顶部「正在缓存」横条新增「查看全部」快捷入口，方便实时掌控多任务下载进度。
            2. **正在缓存批量物理删除与全选重构**：
               - 正在缓存界面全面支持批量多选，彻底将「移除」升级为真实的「物理删除」；
               - 删除任务时自动通过底层 SAF Bridge 与 POSIX 体系同步清除外置 SD 卡或内部存储中的切片与目录，不留残余冗余；
               - 新增「全选 / 取消全选」联动切换与一键「重新下载」按钮（自动清空进度、重置状态并重新排队）。
            3. **离线缓存深度重新扫描与自愈恢复**：
               - 离线缓存界面右上角新增「重新扫描缓存」按钮（同步图标）；
               - 支持一键深度遍历用户指定的 SD 卡存储目录（支持 SAF Tree URI 与 POSIX 物理路径双向解析）；
               - 自动识别原有离线视频，对缺失 `entry.json` 元数据的孤立目录自动通过 B 站 API 重建并补齐信息，恢复即可正常流畅观看。
            4. **已缓存视频支持批量「重新下载」**：
               - 离线缓存主页与合集分 P 详情页在多选模式下新增「重新下载」按钮；
               - 支持快速将已缓存好的视频批量重置并重新加入下载队列拉取。
            5. **外置 SD 卡兼容性与底层流媒体架构稳定**：
               - 深度适配 Android 11~15 Scoped Storage (SAF) 外置 SD 卡写入权限与自包含目录架构；
               - 混流后自动通过 16KB FFmpegKit 生成标准单文件 `0.mp4`，杜绝动态库崩溃；
               - 底层流媒体播放器通过 `openSafFd/fdclose` 管道通信秒级起播，彻底告别黑屏转圈、音画不同步及清理后台任务丢失问题。

            ### 📦 APK 安装包说明
            | 安装包文件 | 适用芯片架构 | 推荐设备 |
            |---|---|---|
            | `piliplus_*_arm64-v8a.apk` | 64 位 ARM | 绝大多数现代手机与平板 (华为/小米/联想等) |
            | `piliplus_*_armeabi-v7a.apk` | 32 位 ARM | 较旧的安卓设备 |
            | `piliplus_*_x86_64.apk` | x86_64 | 电脑安卓模拟器 |

            > ⚠️ 本版本包名为 `com.example.piliplus.sd`，应用名为 `PiliPlus SD`，采用一致的签名构建，可直接覆盖安装后续同款更新。
          files: piliplus_*.apk
