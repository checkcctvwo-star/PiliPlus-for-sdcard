name: Stage1 Verify (tests + build)

on:
  push:
    branches:
      - fix/sdcard-download-loss
  workflow_dispatch:

jobs:
  verify:
    name: flutter test + analyze + build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # 本仓库依赖上游 Flutter SDK 补丁，缺这一步会因 Dart 编译错误失败
      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      # ---- 阶段一的核心验证：单元测试 ----
      - name: Run unit tests
        run: |
          echo "=== test/services/proxy (Range parsing, 15 tests) ==="
          flutter test test/services/proxy/ --reporter expanded
          echo "=== test/services/download (MethodChannel contract + deep scan) ==="
          flutter test test/services/download/ --reporter expanded

      # ---- 静态检查：Dart 类型错误 / 未使用 import ----
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos || true

      # ---- 编译验证：Kotlin +151 行改动从未编译过 ----
      - name: Build debug APK (compiles Kotlin + Dart)
        run: flutter build apk --debug --no-pub

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/**/*.log
            test-results/**
          retention-days: 14
          if-no-files-found: ignore
