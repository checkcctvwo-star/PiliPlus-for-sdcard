name: Android Debug Build (SD Card arm64-v8a)

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target release tag to attach the debug APK to (e.g. v2.1.9-sd-20261015-0953). Leave empty to auto-target latest release.'
        required: false
        default: ''
        type: string

jobs:
  android-debug:
    name: Build Android Debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # 本仓库依赖 Flutter SDK 补丁才能编译
      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      # 自动解析目标 Release Tag（默认自动选取最新 Release）
      - name: Resolve Release Tag
        id: resolve_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.target_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          if [ -z "$TAG" ]; then
            TAG="v2.1.9-sd-$(date +'%Y%m%d-%H%M')"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: ${TAG}"

      # 构建 arm64-v8a 专属 Debug 测试版本 APK
      - name: Build Debug APK (arm64-v8a)
        run: |
          flutter build apk \
            --debug \
            --target-platform android-arm64 \
            --no-pub

      # 规范化重命名 APK
      - name: Rename Debug APK
        id: rename
        shell: bash
        run: |
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          DEST="piliplus_${TAG}_arm64-v8a_debug.apk"
          
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk ]; then
            SRC="build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk"
          elif [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            SRC="build/app/outputs/flutter-apk/app-debug.apk"
          else
            SRC=$(find build/app/outputs/flutter-apk/ -name "*debug*.apk" | head -n 1)
          fi
          
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "Error: Debug APK not found in build/app/outputs/flutter-apk/"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          
          cp "$SRC" "$DEST"
          echo "Renamed: $SRC -> $DEST"
          echo "apk_name=${DEST}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${DEST}" >> "$GITHUB_OUTPUT"

      # 上传 Artifact 供 Actions 页面下载 (保留90天)
      - name: Upload arm64-v8a Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-sdcard-arm64-v8a-debug
          path: piliplus_*_arm64-v8a_debug.apk
          retention-days: 90

      # 将 Debug APK 上传并合并至对应 GitHub Release 中
      - name: Attach Debug APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          FILE="${{ steps.rename.outputs.apk_name }}"
          echo "Uploading $FILE to Release $TAG..."
          gh release upload "$TAG" "$FILE" --clobber
          
          # 更新 Release 说明，追加 Debug 测试版本表格项
          BODY=$(gh release view "$TAG" --json body --jq .body)
          if ! echo "$BODY" | grep -q "arm64-v8a_debug"; then
            echo "Updating release notes with debug APK details..."
            NEW_BODY=$(echo "$BODY" | sed 's/| `piliplus_\*_x86_64\.apk` | x86_64 | 电脑安卓模拟器 |/| `piliplus_*_x86_64.apk` | x86_64 | 电脑安卓模拟器 |\n| `piliplus_*_arm64-v8a_debug.apk` | 64 位 ARM (Debug 测试版) | 测试\/排错专用，可抓取完整 DevTools & Logcat 详细调试日志 |/')
            gh release edit "$TAG" --notes "$NEW_BODY" || true
          fi
